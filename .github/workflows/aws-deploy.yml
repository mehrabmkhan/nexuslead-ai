name: aws-deploy

on:
  workflow_dispatch:
    inputs:
      run_live_acceptance:
        description: "Run mutating live acceptance checks against the AWS URL"
        required: false
        default: "false"
  push:
    branches: ["main"]

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'ca-central-1' }}
  AWS_ROLE_ARN: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
  ECR_REPOSITORY: nexuslead-ai
  EC2_INSTANCE_ID: i-0ff17fb92d002e391
  NEXUSLEAD_HTTPS_DOMAIN: 99-79-66-16.sslip.io
  NEXUSLEAD_RAW_HOST: ec2-99-79-66-16.ca-central-1.compute.amazonaws.com

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Configure AWS credentials
        if: env.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: env.AWS_ROLE_ARN != ''
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        if: env.AWS_ROLE_ARN != ''
        uses: docker/setup-buildx-action@v3

      - name: Build and push multi-arch Docker image
        if: env.AWS_ROLE_ARN != ''
        uses: docker/build-push-action@v6
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Deploy to EC2 with SSM
        if: env.AWS_ROLE_ARN != ''
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          image_uri="$REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}"
          script_b64="$(base64 -w 0 scripts/aws/remote-deploy.sh)"
          parameters="$(jq -n \
            --arg script "$script_b64" \
            --arg image "$image_uri" \
            --arg region "$AWS_REGION" \
            --arg domain "$NEXUSLEAD_HTTPS_DOMAIN" \
            --arg raw_host "$NEXUSLEAD_RAW_HOST" \
            '{commands:[
              "cat >/tmp/nexuslead-remote-deploy.b64 <<EOF\n\($script)\nEOF",
              "base64 -d /tmp/nexuslead-remote-deploy.b64 >/tmp/nexuslead-remote-deploy.sh",
              "chmod +x /tmp/nexuslead-remote-deploy.sh",
              "AWS_REGION=\($region) NEXUSLEAD_IMAGE=\($image) NEXUSLEAD_HTTPS_DOMAIN=\($domain) NEXUSLEAD_RAW_HOST=\($raw_host) /tmp/nexuslead-remote-deploy.sh"
            ]}')"
          command_id="$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy NexusLead AI ${GITHUB_SHA}" \
            --parameters "$parameters" \
            --query "Command.CommandId" \
            --output text)"
          deadline=$((SECONDS + 900))
          while true; do
            status="$(aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" --query "Status" --output text 2>/dev/null || echo Pending)"
            case "$status" in
              Success|Cancelled|TimedOut|Failed)
                aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" --query "{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}" --output json
                test "$status" = "Success"
                exit $?
                ;;
            esac
            if [ "$SECONDS" -ge "$deadline" ]; then
              aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" --query "{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}" --output json || true
              echo "SSM deploy command did not complete within 15 minutes"
              exit 1
            fi
            sleep 15
          done

      - name: Verify HTTPS health
        if: env.AWS_ROLE_ARN != ''
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS "https://$NEXUSLEAD_HTTPS_DOMAIN/health" | grep -q '"status":"ready"'; then
              exit 0
            fi
            sleep 10
          done
          curl -fsS "https://$NEXUSLEAD_HTTPS_DOMAIN/health"

      - name: Run live acceptance checks
        if: env.AWS_ROLE_ARN != '' && github.event_name == 'workflow_dispatch' && github.event.inputs.run_live_acceptance == 'true'
        env:
          NEXUSLEAD_LIVE_URL: https://99-79-66-16.sslip.io
        run: python scripts/live_acceptance.py

      - name: AWS secret note
        if: env.AWS_ROLE_ARN == ''
        run: echo "AWS deploy skipped because AWS_GITHUB_ACTIONS_ROLE_ARN is not configured."
