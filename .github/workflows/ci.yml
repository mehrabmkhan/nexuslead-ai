name: ci

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "src/**"
      - "tests/**"
      - "data/**"
      - "docs/**"
      - "requirements.txt"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "app/**"
      - "src/**"
      - "tests/**"
      - "data/**"
      - "docs/**"
      - "requirements.txt"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Syntax check
        run: python -m compileall app src tests

      - name: Run tests
        run: pytest -q
