<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - NexusLead AI</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --ink: #17202a;
      --muted: #667085;
      --line: #d7dde5;
      --brand: #2563eb;
      --panel: #ffffff;
      --page: #eef2f6;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; background: var(--page); color: var(--ink); }
    main { width: min(440px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 30px; box-shadow: 0 18px 45px rgba(16, 34, 53, .12); }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
    .mark { width: 42px; height: 42px; border-radius: 8px; display: grid; place-items: center; background: #102235; color: white; font-weight: 800; }
    h1 { margin: 0; font-size: 25px; letter-spacing: 0; }
    p { margin: 5px 0 0; color: var(--muted); line-height: 1.45; }
    form { display: grid; gap: 12px; }
    label { display: grid; gap: 6px; font-size: 13px; color: #344054; font-weight: 700; }
    input, button { border: 1px solid #b8c2cc; border-radius: 6px; padding: 10px 12px; font: inherit; min-height: 42px; }
    button { border-color: var(--brand); background: var(--brand); color: white; cursor: pointer; font-weight: 800; }
    .error { background: #fff1f3; border: 1px solid #fda4af; color: #b42318; border-radius: 6px; padding: 10px; margin-bottom: 12px; }
    .hint { margin-top: 16px; font-size: 13px; color: var(--muted); line-height: 1.55; }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <div class="mark">NL</div>
      <div>
        <h1>NexusLead AI</h1>
        <p>Internal B2B lead operations platform for NextRNS-style BPO teams.</p>
      </div>
    </div>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <label>Email
        <input name="email" type="email" autocomplete="email" value="admin@nextrns.local" required>
      </label>
      <label>Password
        <input name="password" type="password" autocomplete="current-password" value="admin123" required>
      </label>
      <button type="submit">Sign in</button>
    </form>
    <div class="hint">
      Admin: admin@nextrns.local / admin123<br>
      Manager: manager@nextrns.local / manager123<br>
      Agent: agent@nextrns.local / agent123
    </div>
  </main>
</body>
</html>
