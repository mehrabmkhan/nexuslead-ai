services:
  - type: web
    name: nexuslead-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: NEXUSLEAD_SESSION_SECRET
        generateValue: true
      - key: NEXUSLEAD_UPLOAD_DIR
        value: uploads
      - key: NEXUSLEAD_EMAIL_PROVIDER
        value: console
